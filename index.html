<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<meta name="description" content="An amateur scouting simulation.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Birddog">
<title>Birddog — amateur scouting</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600&family=Barlow:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>

<script>
/* Paints immediately, then reports anything that goes wrong on screen rather
   than leaving a blank page. */
(function () {
  var app = document.getElementById("app");
  app.innerHTML = '<div style="padding:40px 20px;font:14px system-ui;color:#8DA0B2">'
    + '<div style="font-size:12px;letter-spacing:3px;color:#F2B33D">BIRDDOG</div>'
    + '<div id="boot" style="margin-top:10px">Starting\u2026</div></div>';
  function fail(where, msg) {
    var b = document.getElementById("boot"); if (!b) return;
    b.parentNode.innerHTML = '<div style="font:13px ui-monospace,monospace;color:#E9E5DA">'
      + '<div style="color:#D2504A;font-size:15px;margin-bottom:10px">The game failed to start.</div>'
      + '<div style="background:#18222D;border:1px solid #2C3B4B;border-radius:6px;padding:12px;'
      + 'word-break:break-word;line-height:1.5">' + where + ': ' + String(msg).replace(/</g,"&lt;") + '</div></div>';
  }
  window.addEventListener("error", function (e) {
    fail("Error", (e.message || "unknown") + (e.filename ? " in " + e.filename.split("/").pop() : "")
      + (e.lineno ? " line " + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    fail("Async error", (e.reason && (e.reason.message || e.reason)) || "unknown");
  });
})();
</script>

<script src="js/names.js"></script>
<script src="js/market.js"></script>
<script src="js/schools.js"></script>
<script src="js/core.js"></script>
<script src="js/text.js"></script>
<script src="js/text2.js"></script>
<script src="js/career.js"></script>
<script src="js/world.js"></script>
<script src="js/clubs.js"></script>
<script src="js/economy.js"></script>
<script src="js/saves.js"></script>
<script src="js/ui.js"></script>

<script>
/* Offline. Registered last so a failure here can never stop the game. */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").then(function (reg) {
      // check for a new build whenever the app is opened or refocused
      reg.update();
      document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") reg.update();
      });
      reg.addEventListener("updatefound", function () {
        var sw = reg.installing;
        if (!sw) return;
        sw.addEventListener("statechange", function () {
          if (sw.state === "installed" && navigator.serviceWorker.controller) {
            // a newer version is ready; take it on the next load
            sw.postMessage("skipWaiting");
          }
        });
      });
    }).catch(function () {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", function () {
      if (reloaded) return;
      reloaded = true;
      location.reload();
    });
  });
}
</script>
</body>
</html>
